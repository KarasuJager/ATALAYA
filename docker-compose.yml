services:
  osint:
    build: .
    image: atalaya-osint:latest      # la usa de base Dockerfile.explore
    volumes:
      - ./scope:/scope:ro
      - ./data:/data
      - ../../programs:/programs:ro
      # código montado en vivo: un arreglo en intel/ o scripts/ se aplica sin volver a hacer build
      - ./intel:/app/intel:ro
      - ./scripts:/app/scripts:ro
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY:-}
      - POSTMAN_API_KEY=${POSTMAN_API_KEY:-}
      - HANDLE=${HANDLE:-Manuel_Miguel}
      - PROGRAM_YAML=${PROGRAM_YAML:-}
      - ATALAYA_PASSIVE=${ATALAYA_PASSIVE:-0}
      - INTEL_SKIP=${INTEL_SKIP:-}
      # bbscope (scope de la plataforma con tu sesión → incluye privados). Solo en .env, nunca en git.
      - BBSCOPE_H1_USER=${BBSCOPE_H1_USER:-}
      - BBSCOPE_H1_TOKEN=${BBSCOPE_H1_TOKEN:-}
      - BBSCOPE_BC_TOKEN=${BBSCOPE_BC_TOKEN:-}
      - BBSCOPE_IT_TOKEN=${BBSCOPE_IT_TOKEN:-}
      - BBSCOPE_YWH_TOKEN=${BBSCOPE_YWH_TOKEN:-}

  # Exploradores (Capa 1): docker compose run --rm explore /data/<programa>/<fecha> [--vigia-js /vigia/<programa>/<fecha>/findings/js-raw]
  explore:
    build:
      context: .
      dockerfile: Dockerfile.explore
    image: atalaya-explore:latest
    volumes:
      - ./scope:/scope:ro
      - ./data:/data
      - ../../programs:/programs:ro
      - ../Vigia/data:/vigia:ro
      - ./intel:/app/intel:ro
      - ./explore:/app/explore:ro
      - explore-cache:/cache
    environment:
      - HANDLE=${HANDLE:-Manuel_Miguel}
      - ATALAYA_PASSIVE=${ATALAYA_PASSIVE:-0}
      - EXPLORE_SKIP=${EXPLORE_SKIP:-}

volumes:
  explore-cache:
